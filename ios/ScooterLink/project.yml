# A projektet a generate.sh generálja (a signing.env-ből veszi a DEVELOPMENT_TEAM-et és a
# BUNDLE_ID_PREFIX-et — lásd signing.env.example); közvetlen `xcodegen generate` előtt ezeket
# környezeti változóként kell megadni.
name: ScooterLink
options:
  bundleIdPrefix: ${BUNDLE_ID_PREFIX}
  deploymentTarget:
    iOS: "18.0"                            # a vezérlők (ControlWidget) iOS 18-at kérnek
settingGroups:
  common:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}  # a saját Apple Team ID-d (signing.env); automatikus signing
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "18"
    TARGETED_DEVICE_FAMILY: "1"            # csak iPhone
    SWIFT_VERSION: "5.0"                   # Swift 5 nyelvi mód (nincs Swift 6 szigorú-konkurencia hiba)
    GENERATE_INFOPLIST_FILE: YES
    SCOOTER_APP_GROUP: group.${BUNDLE_ID_PREFIX}.app   # közös állapot az app és a widget között
targets:
  ScooterLink:
    type: application
    platform: iOS
    sources:
      - ScooterLink
      - Shared                             # közös az app és a widget-bővítmény között
    dependencies:
      - target: ScooterWidgets             # beágyazott widget-bővítmény
    entitlements:
      path: Config/ScooterLink.entitlements
      properties:
        com.apple.security.application-groups: [$(SCOOTER_APP_GROUP)]
    info:
      path: Config/ScooterLink-Info.plist
      properties:
        UIBackgroundModes: [bluetooth-central]   # a widgetről indított művelet a háttérben fut
        NSSupportsLiveActivities: true           # a LiveActivityIntent-ek az app folyamatában futnak
        ScooterAppGroup: $(SCOOTER_APP_GROUP)    # a kód innen olvassa (SharedState)
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon      # tools/make_icon.swift állítja elő
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "A roller vezérléséhez és a telemetria olvasásához Bluetooth-hozzáférés kell."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  ScooterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ScooterWidgets
      - Shared
    entitlements:
      path: Config/ScooterWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(SCOOTER_APP_GROUP)]
    info:
      path: Config/ScooterWidgets-Info.plist
      properties:
        CFBundleDisplayName: Roller
        ScooterAppGroup: $(SCOOTER_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.app.widgets
